<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    AddTileConfig /tile/standard/ standard
    LoadTileConfigFile /etc/renderd.conf
    ModTileRenderdSocketName /run/renderd/renderd.sock
    ModTileRequestTimeout 0
    ModTileMissingRequestTimeout 30

    RedirectMatch 404 ^/tile/[0-9]+/

    ProxyPass /tile/light/ http://themes:8080/styles/light/ retry=1
    ProxyPassReverse /tile/light/ http://themes:8080/styles/light/
    ProxyPass /tile/dark/ http://themes:8080/styles/dark/ retry=1
    ProxyPassReverse /tile/dark/ http://themes:8080/styles/dark/
    ProxyPass /tile/natural/ http://themes:8080/styles/natural/ retry=1
    ProxyPassReverse /tile/natural/ http://themes:8080/styles/natural/

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <IfDefine ALLOW_CORS>
        Header set Access-Control-Allow-Origin "*"
    </IfDefine>
</VirtualHost>
