services:
  themes:
    build: ./base-styles/tileserver-gl
    image: afterrealism/tileserver-gl:v5.6.0-local
    environment:
      BIND: 0.0.0.0
      PORT: 8080
      STYLE_ASSET_ROOT: /data/style-assets
    volumes:
      - ./data/openmaptiles:/data/openmaptiles:ro
      - ./data/style-assets:/data/style-assets:ro
      - ./themes/config.json:/data/config.json:ro
      - ./scripts:/workspace/scripts:ro
      - ./themes/start.sh:/workspace/themes/start.sh:ro
    entrypoint: [/workspace/themes/start.sh]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "node", "/usr/src/app/src/healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 60

  planetiler:
    build:
      context: ./base-styles
      dockerfile: planetiler-openmaptiles/Dockerfile
    image: afterrealism/planetiler-openmaptiles:v3.16-local
    profiles: [tools]
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx20g -XX:MaxHeapFreeRatio=40}
      BUILDING_MERGE_Z13: ${BUILDING_MERGE_Z13:-false}
      REUSE_FEATUREDB: ${REUSE_FEATUREDB:-false}
      SORT_MAX_READERS: ${SORT_MAX_READERS:-12}
      SORT_MAX_WRITERS: ${SORT_MAX_WRITERS:-12}
    volumes:
      - ./data:/data
      - ./:/workspace:ro
    entrypoint: [/workspace/scripts/build-openmaptiles.sh]
