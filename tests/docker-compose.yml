services:
  themes:
    image: afterrealism/tileserver-gl:v5.6.0-local
    environment:
      BIND: 0.0.0.0
      PORT: 8080
      STYLE_ASSET_ROOT: /data/style-assets
      TILE_CACHE_CONTROL: "public, max-age=86400, immutable"
      PMTILES_MAX_CACHE_ENTRIES: "512"
    volumes:
      - ../data/openmaptiles:/data/openmaptiles:ro
      - ../data/style-assets:/data/style-assets:ro
      - ../themes/config.json:/data/config.json:ro
      - ../scripts:/workspace/scripts:ro
      - ../themes/start.sh:/workspace/themes/start.sh:ro
    entrypoint: [/workspace/themes/start.sh]
    ports:
      - "${TEST_PORT:-18080}:8080"
